plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ourcat.app'
    compileSdk 34
    def localProps = new Properties()
    def lpFile = rootProject.file('local.properties')
    if (lpFile.exists()) {
        lpFile.withInputStream { localProps.load(it) }
    }
    def baseUrlDebug = localProps.getProperty('OURCAT_BASE_URL_DEBUG', 'http://10.0.2.2:8080/')
    def baseUrlRelease = localProps.getProperty('OURCAT_BASE_URL_RELEASE', 'https://api.example.com/')
    def amapKeyDebug = localProps.getProperty('OURCAT_AMAP_KEY_DEBUG', '')
    def amapKeyRelease = localProps.getProperty('OURCAT_AMAP_KEY_RELEASE', '')
    defaultConfig {
        applicationId "com.ourcat.app"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
        // 以发布版 Key 为默认，与高德只配发布版 SHA1 一致；debug 由 buildTypes.debug 覆盖
        manifestPlaceholders = [AMAP_API_KEY: amapKeyRelease]
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            buildConfigField "String", "BASE_URL", "\"${baseUrlRelease}\""
            manifestPlaceholders = [AMAP_API_KEY: amapKeyRelease]
        }
        debug {
            buildConfigField "String", "BASE_URL", "\"${baseUrlDebug}\""
            manifestPlaceholders = [AMAP_API_KEY: amapKeyDebug]
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    buildFeatures {
        viewBinding true
        buildConfig = true   // 启用 BuildConfig 生成

    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.coordinatorlayout:coordinatorlayout:1.2.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.navigation:navigation-fragment:2.7.6'
    implementation 'androidx.navigation:navigation-ui:2.7.6'
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.6.2'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.6.2'
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'androidx.viewpager2:viewpager2:1.0.0'

    // 高德地图 SDK（已包含定位功能，无需单独引入 location SDK）
    implementation 'com.amap.api:3dmap:9.6.0'
    // 高德搜索服务（逆地理编码）
    implementation 'com.amap.api:search:9.7.0'
}

android.useAndroidX=true
android.enableJetifier=true
# Allow project path with non-ASCII characters (e.g. D:\桌面\OurCat) on Windows
android.overridePathCheck=true
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# --- JdkImageTransform / jlink 失败说明 ---
# 并非 AGP 与 JDK 17 “版本不兼容”：AGP 8.x 官方要求且支持 JDK 17，17.0.12 在支持范围内。
# 失败原因是 AGP 在编译时用当前 JVM 的 jlink 生成 JDK 镜像，jlink.exe 执行后退出码为 1，常见原因：
# 1) Gradle 使用的 JBR 路径含空格（如 D:\Android\Android Studio\jbr），导致 jlink 参数解析异常；
# 2) 个别 JBR 构建中 jlink 与 AGP 的调用方式存在兼容问题（Google Issue 317235925 等）。
# 解决：让 Gradle 使用「路径无空格的 JDK 17」即可（推荐复制 jbr 到 D:\jbr 并设置下方属性）。
# org.gradle.java.home=D\:\\jbr
